<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css"> 
        <script type="module" src="script.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <title>Jukebox</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div>

            <h1>🎵Jukebox🎵</h1>
            <h2>Songs: </h2>
            <ol id="song-list"></ol>
            <div class="player-container">
                
                <audio id="myAudio" controls></audio>

                <button class="play">Play</button>
                <button class="pause">Pause</button>
                <button class="Previous">Previous</button>
                <button class="Next">Next</button>

                <p id="title"></p>
            </div>
        

            <div class="slideContainer">
                <input type="range" min="1" max="100" value="1" id="myRange" class="slider">
                <p>Value: <span id="value"></span></p>
           </div>
           
           <div class="shared-queue">
             <h2>Request a song</h2>

             <select id="song-choice">
                <option value="">Choose a song...</option>
             </select>

             <button id="add-to-queue">Add to queue</button>

             <p1 id="queue-message" aria-live="polite"></p1>

             <h3>Shared queue</h3>

             <ol1 id="shared-queue-list"></ol1>
            </div>
            

        </div>
    </body>
</html>
